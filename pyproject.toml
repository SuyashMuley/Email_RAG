[project]
name = "email-rag"
version = "0.1.0"
description = "Local RAG over personal email (Gmail), with pgvector and an Ollama LLM"
requires-python = ">=3.11"

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rag.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
